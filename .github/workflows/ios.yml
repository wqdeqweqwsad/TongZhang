name: iOS build and tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and run XCTest on iPhone Simulator
        run: >-
          xcodebuild test
          -project TongZhang.xcodeproj
          -scheme TongZhang
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log

      - name: Build unsigned device app for free sideloading
        run: >-
          xcodebuild build
          -project TongZhang.xcodeproj
          -scheme TongZhang
          -sdk iphoneos
          -configuration Release
          -derivedDataPath "$RUNNER_TEMP/DeviceBuild"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/DeviceBuild/Build/Products/Release-iphoneos/TongZhang.app" "$RUNNER_TEMP/ipa/Payload/TongZhang.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/TongZhang-unsigned.ipa" Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TongZhang-unsigned-ipa
          path: ${{ runner.temp }}/TongZhang-unsigned.ipa
